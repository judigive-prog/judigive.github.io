name: CI with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-site .

      - name: Run container and check it serves the page
        run: |
          docker run -d -p 8080:80 --name site my-site
          sleep 3
          curl --fail http://localhost:8080 | grep "Judit Giner"